services:
  db:
    image: pgvector/pgvector:pg16
    container_name: interviewiq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewiq
      POSTGRES_USER: interviewiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - interviewiq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewiq -d interviewiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: interviewiq-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://interviewiq:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/interviewiq
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8501:8501"
    volumes:
      - interviewiq_uploads:/app/data/uploads

volumes:
  interviewiq_postgres:
  interviewiq_uploads:
