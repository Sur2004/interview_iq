<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font:14px system-ui,sans-serif;color:#172033}.card{border:1px solid #dbe2ea;border-radius:12px;padding:12px;background:#fff}
.header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.status{font-size:12px;font-weight:650;border-radius:99px;padding:5px 9px;background:#fef3c7;color:#92400e}
.status.ok{background:#dcfce7;color:#166534}video{display:block;width:100%;max-height:200px;object-fit:cover;background:#0f172a;border-radius:9px}
p{font-size:12px;line-height:1.45;color:#667085;margin:8px 0 0}
</style></head><body>
<div class="card"><div class="header"><strong>Camera check</strong><span id="status" class="status">Waiting for permission</span></div>
<video id="preview" autoplay playsinline muted></video><p id="note">Camera preview is visible while the interview is active. Video is not recorded or saved by this component.</p></div>
<script>
(function(){
 const video=document.getElementById("preview"), status=document.getElementById("status"), note=document.getElementById("note");
 let stream=null, camera="starting", switches=0, hiddenAt=0, ready=false;
 function report(eventName){
  if(!ready)return;
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:{camera:camera,tab_switches:switches,event:eventName,visible:document.visibilityState==="visible",timestamp:Date.now()}},"*");
 }
 async function start(){
  try{
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("Camera is not supported by this browser.");
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
   video.srcObject=stream;camera="active";status.textContent="Camera on";status.className="status ok";
   note.textContent="Camera preview is active. Video is not recorded or saved by this component.";report("camera_started");
  }catch(e){
   camera="denied";status.textContent="Camera unavailable";note.textContent="Allow camera permission and reload this section. "+(e&&e.message?e.message:"");report("camera_denied");
  }
 }
 window.addEventListener("message",function(e){
  const d=e.data||{};
  if(d.type==="streamlit:render"){
   ready=true;
   window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
   window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:300},"*");
   if(camera==="starting")start();
  }
 });
 document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();return;}
  if(hiddenAt&&Date.now()-hiddenAt>250){switches+=1;report("tab_switch_detected");}
  hiddenAt=0;
 });
 window.addEventListener("beforeunload",function(){if(stream)stream.getTracks().forEach(t=>t.stop());});
 window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
})();
</script></body></html>
