<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;padding:0;background:transparent;font:12px system-ui;color:#667085}#status{padding:3px 0}</style>
</head><body><div id="status" aria-live="polite">Syncing browser storage…</div>
<script>
(function(){
  const KEY = "interviewiq.browser-data.v1";
  let lastWrite = null;
  let readSent = false;
  const status = document.getElementById("status");
  function send(value){
    window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:value},"*");
  }
  function readData(){
    try {
      const raw = window.localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : {sessions:{},profiles:{}};
      return parsed && typeof parsed === "object" ? parsed : {sessions:{},profiles:{}};
    } catch(e) {
      status.textContent = "Browser storage could not be read. A fresh local history will be used.";
      return {sessions:{},profiles:{}};
    }
  }
  function render(event){
    if(!event || !event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
    window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:24},"*");
    if(args.action === "read"){
      // Read localStorage only once per iframe lifetime. Sending the same value on every
      // Streamlit rerun can keep the app in a perpetual "running" state.
      if(!readSent){
        readSent = true;
        send(readData());
      }
      status.textContent = "Browser-only storage enabled";
    } else if(args.action === "write" && typeof args.payload === "string" && args.payload !== lastWrite){
      lastWrite = args.payload;
      try {
        window.localStorage.setItem(KEY, args.payload);
        status.textContent = "Saved in this browser";
      } catch(e) {
        status.textContent = "Browser storage is full or unavailable. Export your reports to keep a copy.";
      }
    }
  }
  window.addEventListener("message",render);
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
})();
</script></body></html>
